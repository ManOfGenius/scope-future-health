let AUD_DIM = "Nationality group";
function calibChart(m, title) {
  const W = 310, H = 230, pad = {l: 52, r: 12, t: 12, b: 34};
  const mx = Math.max(...m.calibration.map(c => Math.max(c.pred, c.obs))) * 1.1;
  const nice = mx > .4 ? .1 : mx > .2 ? .05 : .02, top = Math.ceil(mx / nice) * nice;
  const x = v => pad.l + v / top * (W - pad.l - pad.r), y = v => H - pad.b - v / top * (H - pad.t - pad.b);
  let grid = ""; for (let v = 0; v <= top + 1e-9; v += nice) grid += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v * 100)}%</text><text x="${x(v)}" y="${H - pad.b + 14}" text-anchor="middle" font-size="10" fill="var(--muted)">${Math.round(v * 100)}%</text>`;
  const pts = m.calibration.map(c => `${x(c.pred)},${y(c.obs)}`).join(" ");
  return `<div class="calib"><span class="eyebrow">${title}</span>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} calibration">${grid}
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(top)}" y2="${y(top)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
    <polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="2"/>
    ${m.calibration.map(c => `<circle cx="${x(c.pred)}" cy="${y(c.obs)}" r="4.5" fill="var(--teal)" stroke="var(--surface)" stroke-width="2"><title>Predicted ${pct(c.pred, 1)} · observed ${pct(c.obs, 1)} · n=${c.n}</title></circle>`).join("")}
    <text x="${(W + pad.l) / 2}" y="${H - 4}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">Predicted risk (decile mean)</text>
    <text x="11" y="${(H - pad.b) / 2}" font-size="10.5" fill="var(--ink-2)" transform="rotate(-90 11 ${(H - pad.b) / 2})" text-anchor="middle">Observed</text></svg>
    <p class="tiny muted num">AUC ${m.auc_test.toFixed(2)} · Brier ${m.brier_test.toFixed(3)} · held-out n=${fmt(m.n_test)}. Dashed line is perfect calibration.</p></div>`;
}
function validationPanel() {
  const V = D.validation, A = D.anchors, names = Object.keys(V.auc);
  const bar = (v, mx, best) => `<div class="brow" style="height:14px"><div class="b ${best ? "bayt" : "base"}" style="width:${v / mx * 100}%;height:14px"></div><span class="val" style="left:calc(${v / mx * 100}% + 6px)">${v.toFixed(2)}</span></div>`;
  const rows = (obj, mx, fmtv) => names.map(n => `<div class="cmp-row"><div class="lab">${esc(n)}</div><div class="bars">${bar(obj[n], mx, n.startsWith("S.C.O.P.E"))}</div><div></div></div>`).join("");
  const an = [["diabetes_prevalence_20_79", "Diabetes prevalence, adults 20–79", v => pct(v, 1)], ["diabetes_undiagnosed_share", "Share of diabetes undiagnosed", v => pct(v)]]
    .map(([k, l, f]) => `<tr><td>${l}</td><td class="r num">${f(A[k].synthetic)}</td><td class="r num">${f(A[k].value)}</td><td class="small muted">${esc(A[k].source)}</td></tr>`).join("");
  return `<div class="grid2">
    <div class="panel"><h3>Benchmark against a published score</h3><p class="small muted" style="margin-bottom:12px">${esc(V.benchmark_population)}. Outcome: cardiometabolic event or diabetes within 3 years. FINDRISC is the Finnish Diabetes Risk Score (Lindström &amp; Tuomilehto, 2003).</p>
      <span class="eyebrow">Discrimination (AUC)</span><div class="cmp" style="margin:6px 0 14px">${rows(V.auc, 1)}</div>
      <span class="eyebrow">Share of future cases in the top 10% of scores</span><div class="cmp" style="margin-top:6px">${rows(V.top_decile_capture, .6)}</div></div>
    <div class="panel"><h3>Anchored to published UAE figures</h3><p class="small muted" style="margin-bottom:10px">The synthetic population is tuned so that headline rates match published estimates. Agreement here does not validate the model on real patients; that happens in the pilot.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Indicator</th><th class="r">Synthetic</th><th class="r">Published</th><th>Source</th></tr></thead><tbody>${an}</tbody></table></div></div></div>`;
}
function renderSafeguards() {
  const rows = D.audit[AUD_DIM], sc = D.small_cell;
  const cell = v => v == null ? `<td class="r sup">suppressed</td>` : `<td class="r num">${pct(v)}</td>`;
  const body = rows.map(r => r.suppressed ? `<tr><td>${esc(r.segment)}</td><td class="r sup">&lt;${sc}</td><td colspan="7" class="sup">Fewer than ${sc} people: all figures suppressed</td></tr>` :
    `<tr><td>${esc(r.segment)}</td><td class="r num">${fmt(r.n)}</td><td class="r num">${r.need == null ? '<span class="sup">&lt;' + sc + '</span>' : fmt(r.need)}</td>
     ${cell(r.base_reach)}${cell(r.bayt_reach)}${cell(r.base_sens)}${cell(r.plain_sens)}${cell(r.bayt_sens)}${cell(r.bayt_ppv)}</tr>`).join("");
  $("#v-safeguards").innerHTML = `
  <div style="display:grid;gap:8px"><span class="eyebrow">Local population safeguards</span><h2>Who the model reaches, and who it misses</h2>
  <p class="lede">Every cycle is audited by segment before invitations go out. Sensitivity is the share of people with real unmet need who are invited. Any cell under ${sc} people is suppressed, and rates are withheld when the group with need is that small.</p></div>
  <div class="panel" style="display:grid;gap:8px"><h3>Audit alerts this cycle</h3>
    ${D.alerts.map(a => `<div class="alert ${a.level}"><b>${{open: "Action", resolved: "Resolved", watch: "Watch"}[a.level]}</b><span>${esc(a.text)}</span></div>`).join("") || `<p class="muted">No alerts.</p>`}
    <p class="tiny muted">Calibration alerts use an exact Poisson 95% interval on observed events. Action is taken only when the interval excludes 1; otherwise the segment stays under watch.</p></div>
  <div style="display:grid;gap:10px">
    <div class="filters"><label>Segment by<select id="au-dim">${Object.keys(D.audit).map(k => `<option ${k === AUD_DIM ? "selected" : ""}>${k}</option>`).join("")}</select></label>
      <span class="small muted">Same 600-person budget for each strategy.</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Segment</th><th class="r">People</th><th class="r">With real need</th><th class="r">Reach · rules</th><th class="r">Reach · S.C.O.P.E</th>
      <th class="r">Sensitivity · rules</th><th class="r">Sensitivity · S.C.O.P.E, pure priority</th><th class="r">Sensitivity · S.C.O.P.E + equity floor</th><th class="r">Precision · S.C.O.P.E</th></tr></thead><tbody>${body}</tbody></table></div>
    <p class="tiny muted">"Real need" comes from the hidden ground truth of the synthetic population, which a live system would only learn from outcomes. Precision is the share of invited people who had real need.</p></div>
  ${validationPanel()}
  <div class="grid3">
    <div class="panel">${calibChart(M.adult, M.adult.name)}</div>
    <div class="panel">${calibChart(M.child, M.child.name)}</div>
    <div class="panel" style="display:grid;gap:10px;align-content:start"><h3>Built-in protections</h3><ul class="rules">
      <li>Equity floor: each language group receives at least 80% of its share of estimated need before pure priority fills the rest.</li>
      <li>Calibration is checked per segment with an exact 95% interval. A significant deviation triggers shrinkage-based recalibration before the next cycle.</li>
      <li>Low-confidence and insufficient-data flags are routed to a person for review, never auto-messaged at high intensity.</li>
      <li>Ancestry is used only where guidelines set different thresholds (South Asian cardiometabolic risk), and is audited.</li></ul></div>
  </div>`;
  $("#au-dim").onchange = e => { AUD_DIM = e.target.value; renderSafeguards(); };
}

/* ================= OUTCOMES ================= */
function renderOutcomes() {
  const strat = [["baseline_age_sex_rules", "Current age/sex rules", "Everyone due by age is equally likely to be contacted; generic SMS in Arabic or English."],
    ["bayt_prioritisation_only", "S.C.O.P.E ranking only", "Households ranked by need and risk; standard messages."],
    ["bayt_full_no_equity_floor", "S.C.O.P.E ranking + tailoring", "Adds language, family bundling, timing and channel."],
    ["bayt_full", "S.C.O.P.E full (with equity floor)", "The configuration shown in this prototype."],
    ["bayt_full_half_effects", "S.C.O.P.E full, tailoring effects halved", "Stress test of the tailoring assumptions."]];
  const mets = [["true_high_risk_reached", "High-risk people reached"], ["care_gaps_closed", "Care gaps closed"], ["completed_child_visits", "Child visits completed"],
    ["completed_adult_screens", "Adult screens completed"], ["mchat_completed", "M-CHAT-R completed"], ["vaccines_caught_up", "Vaccines caught up"], ["undiagnosed_diabetes_found", "Undiagnosed diabetes found"], ["cascade_tests", "Family genetic follow-ups"], ["language_minority_reached", "Minority-language reach"]];
  const body = strat.map(([k, n, d]) => `<tr><td><b>${n}</b><div class="tiny muted">${d}</div></td>${mets.map(([m]) => { const v = S[k][m]; return `<td class="r num">${fmt(Math.round(v.mean))}<div class="tiny muted">${fmt(Math.round(v.lo))}–${fmt(Math.round(v.hi))}</div></td>`; }).join("")}</tr>`).join("");
  const eff = Object.entries(S.effects).map(([k, v]) => `<tr><td>${esc(k.replace(/_/g, " "))}</td><td class="r num">+${v.toFixed(2)}</td><td class="r num">×${Math.exp(v).toFixed(2)}</td></tr>`).join("");
  const comm = D.community.filter(c => c.gap_rate != null).slice(0, 10).map(c => `<tr><td>${esc(c.district)}<div class="tiny muted">${esc(c.region)}</div></td><td class="r num">${fmt(c.n)}</td><td class="r num">${pct(c.gap_rate)}</td><td class="r num">${c.workers ?? "–"}</td><td class="r num">${c.pathway_gap ?? "–"}</td><td class="r num">${c.overdue_child ?? "–"}</td></tr>`).join("");
  $("#v-outcomes").innerHTML = `
  <div style="display:grid;gap:8px"><span class="eyebrow">Outcome-based evaluation</span><h2>Measured in completed visits, not in flags</h2>
  <p class="lede">Each strategy contacts the same 600 people per 90-day cycle. Attendance follows a hidden model of each person's behaviour; 200 simulated cycles give the mean and 95% interval. The tailoring effects are explicit assumptions you can read below.</p></div>
  <div class="tbl-wrap"><table><thead><tr><th>Strategy</th>${mets.map(([, n]) => `<th class="r">${n}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
  <div class="grid2">
    <div class="panel"><h3>What the comparison shows</h3><ul class="rules">
      <li>Ranking alone completes fewer child visits than the age rules, because it deliberately targets families who rarely attend. It still reaches more people at high risk.</li>
      <li>Tailoring converts that targeting into attendance: language-concordant, bundled, well-timed invitations roughly double the high-risk people reached.</li>
      <li>The equity floor costs almost nothing in total yield and doubles reach in minority languages.</li>
      <li>Family genetic follow-up does not exist under age rules. It appears only when genomic results and family links are used with consent.</li></ul></div>
    <div class="panel"><h3>Tailoring assumptions</h3><p class="small muted" style="margin-bottom:8px">Added to each person's log-odds of attending. Sized from published reminder and language-concordance studies; confirmed or replaced in the pilot.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Effect</th><th class="r">Log-odds</th><th class="r">Odds ratio</th></tr></thead><tbody>${eff}</tbody></table></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Pilot evaluation plan</h3><ul class="rules">
      <li><b>Design:</b> stepped-wedge rollout across primary-care catchments in Abu Dhabi City, Al Ain and Al Dhafra over 4 cycles; every catchment ends on S.C.O.P.E.</li>
      <li><b>Primary outcomes:</b> completed Well-Child Visits at scheduled age, IFHAS completion within the 3-year cycle, M-CHAT-R uptake at 18 and 24 months (target 100%).</li>
      <li><b>Timeliness:</b> days from due date to attendance; abnormal-result follow-up within 7 days and specialist review within 2–4 weeks, as the WCV standard sets.</li>
      <li><b>Recall and follow-up:</b> share of positive M-CHAT-R referred and seen; cascade relatives counselled within 90 days.</li>
      <li><b>Model quality:</b> calibration slope and ratio per segment each cycle; AUC on realised outcomes.</li>
      <li><b>Downstream value:</b> earlier diagnoses (developmental, diabetes, familial hypercholesterolaemia), visits saved through bundling, cost per completed preventive action.</li></ul></div>
    <div class="panel"><h3>Community view: where to send mobile clinics</h3><p class="small muted" style="margin-bottom:8px">Districts ranked by share of residents with an open item. Cells under ${D.small_cell} are suppressed.</p>
      <div class="tbl-wrap"><table><thead><tr><th>District</th><th class="r">People</th><th class="r">With open item</th><th class="r">In shared housing</th><th class="r">No funded pathway</th><th class="r">Children overdue</th></tr></thead><tbody>${comm}</tbody></table></div></div>
  </div>`;
}

/* ================= GOVERNANCE ================= */
const BENCH = /*__BENCH__*/null;
function interopPanel() {
  const rs = [["Patient", "Person, language, household link"], ["Group", "Household"], ["RelatedPerson", "Parent–child links"],
    ["DetectedIssue", "Each care gap with its rule, source and follow-up"], ["ImmunizationRecommendation", "Missing or due vaccines"],
    ["RiskAssessment", "Score, interval, confidence and factors"], ["Consent", "One per data category, permit or deny"],
    ["Task", "The Family Health Day"], ["CommunicationRequest", "The invitation, with no health detail"], ["AuditEvent", "Every read, write and refusal"]];
  const b = BENCH || {};
  const bm = [["Score 3.8 million people (whole emirate)", b.vectorised_scoring_3800000 != null ? `${b.vectorised_scoring_3800000.toFixed(2)} s` : "–"],
    ["Consent-aware evaluation per person", b.live_eval_us_per_person != null ? `${b.live_eval_us_per_person} µs` : "–"],
    ["Whole emirate, one CPU core", b.live_eval_3_8M_minutes_one_core != null ? `${b.live_eval_3_8M_minutes_one_core} min` : "–"],
    ["Family plan API call, 95th percentile", b.family_plan_ms_p95 != null ? `${b.family_plan_ms_p95} ms` : "–"]];
  return `<div class="grid2">
    <div class="panel"><h3>Interoperability: FHIR R4 API</h3><p class="small muted" style="margin-bottom:10px">Every output in this console is also served as standard FHIR resources, so Malaffi, facility EMRs and messaging platforms can consume it without custom integration. Each call carries a role and a purpose of use, and is written to the audit trail.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Resource</th><th>Carries</th></tr></thead><tbody>${rs.map(([r, d]) => `<tr><td class="mono">${r}</td><td>${d}</td></tr>`).join("")}</tbody></table></div>
      <p class="tiny muted" style="margin-top:8px">Roles: clinician, care coordinator, analyst (aggregates only), auditor, family member (own household). 24 automated tests cover rules, privacy and access control.</p></div>
    <div class="panel"><h3>Measured scale</h3><p class="small muted" style="margin-bottom:10px">Benchmarked on a single laptop core with the prototype code. Rule evaluation is independent per household, so it parallelises across cloud workers.</p>
      <div class="tbl-wrap"><table><tbody>${bm.map(([l, v]) => `<tr><td>${l}</td><td class="r num"><b>${v}</b></td></tr>`).join("")}</tbody></table></div>
      <p class="tiny muted" style="margin-top:8px">Abu Dhabi has about 3.8 million residents. Nightly full refresh and on-demand recalculation after a consent change are both well inside interactive time.</p></div></div>`;
}
function renderGovernance() {
  const ledger = [
    ["Well-Child Visit and IFHAS records", "Malaffi health information exchange; facility EMR", "Find due and overdue items under the DoH standards", "Always, for eligible people", "Clinician, programme team"],
    ["Claims and visit history", "Shafafiya / insurer claims", "Confirm completed screens; avoid duplicate invitations", "Always", "Programme team"],
    ["Genomic results", "Emirati Genome Programme, premarital and newborn screening", "Cascade invitations and FH risk only; never adult-onset findings for minors", "Explicit opt-in per person", "Genetic counsellor; scores only for others"],
    ["Family links", "Family book / household registry", "Bundle visits; family history; cascade letters", "Opt-in, revocable", "Programme team"],
    ["Social and contextual data", "Address, language, distance, work pattern", "Choose channel, language and time; equity audit", "Opt-in, revocable", "Outreach team"],
    ["Outreach responses", "Messaging platform", "Learn timing and channel; respect stop requests", "Always; STOP is honoured at once", "Outreach team"],
  ].map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("");
  const card = (m, use) => `<div class="panel"><h3>${esc(m.name)}</h3><dl class="kv" style="margin-top:6px">
    <dt>Use</dt><dd>${use}</dd><dt>Type</dt><dd>Logistic regression, ${m.features.length} inputs, 30 bootstrap refits for intervals</dd>
    <dt>Training</dt><dd class="num">${fmt(m.n_train)} synthetic records; held-out ${fmt(m.n_test)}</dd>
    <dt>Performance</dt><dd class="num">AUC ${m.auc_test.toFixed(2)}, Brier ${m.brier_test.toFixed(3)}, base rate ${pct(m.prevalence, 1)}</dd>
    <dt>Inputs</dt><dd class="small">${m.labels.map(esc).join(" · ")}</dd>
    <dt>Not for</dt><dd>Diagnosis, insurance or employment decisions, or ranking individuals outside the outreach programme</dd></dl></div>`;
  $("#v-governance").innerHTML = `
  <div style="display:grid;gap:8px"><span class="eyebrow">Responsible AI and data governance</span><h2>Every flag shows its data, its rule and its limits</h2>
  <p class="lede">Guideline rules decide eligibility. Models only order the work and never override a guideline. Each data source has a stated purpose and a consent basis, and every invitation can be traced back to both.</p></div>
  <div class="panel"><h3>System architecture</h3><div class="diagram" style="overflow-x:auto">
    <svg viewBox="0 0 960 300" role="img" aria-label="S.C.O.P.E architecture">
      ${[["Malaffi HIE · EMR", 30], ["IFHAS · WCV · claims", 82], ["Genome programme (opt-in)", 134], ["Family links (opt-in)", 186], ["Language · distance · work", 238]].map(([t, y]) => `<rect x="10" y="${y}" width="200" height="40" rx="8" fill="var(--surface-2)" stroke="var(--line)"/><text x="110" y="${y + 25}" text-anchor="middle" font-size="12" fill="var(--ink)">${t}</text>`).join("")}
      <rect x="280" y="30" width="390" height="248" rx="12" fill="var(--teal-soft)" stroke="var(--teal)"/>
      <text x="475" y="56" text-anchor="middle" font-size="15" font-family="Reem Kufi, sans-serif" fill="var(--teal-ink)">S.C.O.P.E engine</text>
      ${[["Consent filter", 300, 74], ["Guideline rules (WCV v10, IFHAS)", 485, 74], ["Calibrated risk + intervals", 300, 134], ["Family graph + cascade", 485, 134], ["Equity floor + small-cell audit", 300, 194], ["Timing + channel planner", 485, 194]].map(([t, x, y]) => `<rect x="${x}" y="${y}" width="170" height="46" rx="7" fill="var(--surface)" stroke="var(--line)"/><text x="${x + 85}" y="${y + 28}" text-anchor="middle" font-size="11.5" fill="var(--ink)">${t}</text>`).join("")}
      ${[["Clinician worklist", 30], ["Family Health Day plan", 94], ["Invitation in family language", 158], ["DoH dashboard", 222]].map(([t, y]) => `<rect x="740" y="${y}" width="200" height="46" rx="8" fill="var(--surface-2)" stroke="var(--line)"/><text x="840" y="${y + 28}" text-anchor="middle" font-size="12" fill="var(--ink)">${t}</text>`).join("")}
      ${[50, 102, 154, 206, 258].map(y => `<path d="M210,${y} C245,${y} 245,154 280,154" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`).join("")}
      ${[53, 117, 181, 245].map(y => `<path d="M670,154 C705,154 705,${y} 740,${y}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`).join("")}
      <path d="M840,268 L840,292 L475,292 L475,278" fill="none" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="660" y="288" text-anchor="middle" font-size="10.5" fill="var(--muted)">attendance and results feed recalibration</text>
    </svg></div></div>
  <div><h3 style="margin-bottom:10px">Authorised data use</h3><div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Source</th><th>Used for</th><th>Basis</th><th>Who sees detail</th></tr></thead><tbody>${ledger}</tbody></table></div></div>
  ${interopPanel()}
  <div class="grid3">${card(M.adult, "Orders adult outreach; suggests diabetes-prevention referral for clinician confirmation")}${card(M.child, "Orders child outreach; flags priority developmental surveillance at the next visit")}${card(M.engage, "Chooses outreach intensity and channel; never affects clinical eligibility")}</div>
  <div class="grid2">
    <div class="panel"><h3>Human oversight</h3><ul class="rules">
      <li>A clinician reviews every risk-based pathway before the invitation is sent.</li>
      <li>Insufficient-data flags go to a care coordinator instead of an automated message.</li>
      <li>Every score is logged with its inputs, consent state, rule version (${esc(D.version)}) and model version.</li>
      <li>Families can see why they were invited and change their data choices at any time.</li></ul></div>
    <div class="panel"><h3>Assumptions and limits of this prototype</h3><ul class="rules">
      <li>All records are synthetic. Rates are plausible orders of magnitude, not Abu Dhabi statistics. Founder-variant frequencies are enriched so that family follow-up can be demonstrated.</li>
      <li>Tailoring effects on attendance are assumptions until measured in the pilot.</li>
      <li>IFHAS rules follow the published 2025 package and immunisation rules follow DoH Circular 2026/77; both are re-checked at integration.</li>
      <li>Per-segment recalibration uses shrinkage toward zero; two segments still show significant miscalibration on the synthetic test fold and are flagged for action.</li>
      <li>The adult model beats FINDRISC and age alone on synthetic data only. Real-world performance must be established on Malaffi records in the pilot.</li>
      <li>Message translations need native-speaker and clinical review.</li></ul></div>
  </div>`;
}

/* ================= ROUTER ================= */
const VIEWS = {home: renderHome, overview: renderOverview, worklist: renderWorklist, family: renderFamily, familyapp: renderFamilyApp, safeguards: renderSafeguards, outcomes: renderOutcomes, governance: renderGovernance};
function route() {
  let h = (location.hash || "#home").slice(1);
  if (h === "family-app") h = "familyapp";
  else if (h.startsWith("family-")) { const id = h.slice(7); if (HH[id]) currentFamily = id; h = "family"; }
  if (!VIEWS[h]) h = "home";
  for (const k of Object.keys(VIEWS)) $("#v-" + k).hidden = k !== h;
  const href = h === "familyapp" ? "#family-app" : "#" + h;
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === href ? "page" : "false"));
  VIEWS[h]();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
